<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos Milo - Menú</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🌮 Tacos Milo</h1>
    <p>Haz tu pedido</p>
</header>

<main>

    <!-- TACOS -->
    <section class="categoria">

        <h2>🌮 Tacos</h2>

        <div id="tacos"></div>

    </section>


    <!-- GRINGAS -->

    <section class="categoria">

        <h2>🫓 Gringas</h2>

        <div id="gringas"></div>

    </section>


    <!-- LONCHES -->

    <section class="categoria">

        <h2>🥪 Lonches</h2>

        <div id="lonches"></div>

    </section>


    <!-- QUESADILLAS -->

    <section class="categoria">

        <h2>🧀 Quesadillas</h2>

        <div id="quesadillas"></div>

    </section>


    <!-- VOLCANES -->

    <section class="categoria">

        <h2>🌋 Volcanes</h2>

        <div id="volcanes"></div>

    </section>


    <!-- BEBIDAS -->

    <section class="categoria">

        <h2>🥤 Bebidas</h2>

        <div id="bebidas"></div>

    </section>



    <!-- CARRITO -->

    <section class="carrito">

        <h2>🛒 Mi pedido</h2>

        <div id="listaCarrito">

            No hay productos

        </div>

        <h3>

            Total: $

            <span id="total">

                0

            </span>

        </h3>

        <hr>

        <input
            type="text"
            id="nombre"
            placeholder="Nombre del cliente">

        <select id="tipoPedido">

            <option value="Para llevar">

                Para llevar

            </option>

            <option value="Comer aquí">

                Comer aquí

            </option>

        </select>


        <div id="contenedorMesa" style="display:none;">

            <input
                type="number"
                id="mesa"
                placeholder="Número de mesa">

        </div>

        <button id="enviarPedido">

            Enviar pedido 🌮

        </button>

    </section>

</main>

<script type="module" src="menu.js"></script>

</body>
</html>
