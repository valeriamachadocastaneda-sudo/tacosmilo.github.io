<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tacos Milo</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>🌮 TACOS MILO</h1>

    <p>El mejor sabor de la ciudad</p>

</header>

<main>

    <!-- =======================
         SELECCIONAR PLATO
    ======================== -->

    <section class="seccion">

        <h2>🍽 Selecciona un lugar</h2>

        <div id="platos">

            <button class="botonPlato" data-plato="Plato 1">🍽 Plato 1</button>

            <button class="botonPlato" data-plato="Plato 2">🍽 Plato 2</button>

            <button class="botonPlato" data-plato="Plato 3">🍽 Plato 3</button>

            <button class="botonPlato" data-plato="Plato 4">🍽 Plato 4</button>

            <button class="botonPlato" data-plato="Plato 5">🍽 Plato 5</button>

            <button class="botonPlato" data-plato="Plato 6">🍽 Plato 6</button>

            <button class="botonPlato" data-plato="Para llevar">🥡 Para llevar</button>

        </div>

    </section>

    <!-- =======================
         MENÚ
    ======================== -->

    <div id="menu" style="display:none;">

        <section class="seccion">

            <h2>🌮 Tacos</h2>

            <div id="listaTacos"></div>

        </section>

        <section class="seccion">

            <h2>🫓 Gringas</h2>

            <div id="listaGringas"></div>

        </section>

        <section class="seccion">

            <h2>🥪 Lonches</h2>

            <div id="listaLonches"></div>

        </section>

        <section class="seccion">

            <h2>🧀 Quesadillas</h2>

            <div id="listaQuesadillas"></div>

        </section>

        <section class="seccion">

            <h2>🌋 Volcanes</h2>

            <div id="listaVolcanes"></div>

        </section>

        <section class="seccion">

            <h2>🥤 Bebidas</h2>

            <div id="listaBebidas"></div>

        </section>

    </div>

    <!-- =======================
         CARRITO
    ======================== -->

    <aside id="carrito">

        <h2>🛒 Mi Pedido</h2>

        <p id="platoSeleccionado">
            Ningún plato seleccionado
        </p>

        <div id="listaCarrito">

            No hay productos

        </div>

        <h3 class="total">

            Total:
            $
            <span id="total">
                0
            </span>

        </h3>

        <button id="confirmar">

            Confirmar pedido

        </button>

    </aside>

</main>

<script type="module" src="menu.js"></script>

</body>

</html>
