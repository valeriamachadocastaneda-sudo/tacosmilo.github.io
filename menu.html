<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tacos Milo</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="encabezado">


<img 
src="imagenes/logo.png" 
class="logo"
alt="Logo Tacos Milo"
>


<h1>
🌮 TACOS MILO
</h1>


<p>
El mejor sabor de la ciudad
</p>


</header>




<main>


<!-- SELECCIÓN DE PLATO -->

<section class="seccion">


<h2>
🍽 Selecciona tu lugar
</h2>



<div id="platos">


<button class="botonPlato">

🍽 Plato 1

</button>


<button class="botonPlato">

🍽 Plato 2

</button>


<button class="botonPlato">

🍽 Plato 3

</button>


<button class="botonPlato">

🍽 Plato 4

</button>


<button class="botonPlato">

🍽 Plato 5

</button>


<button class="botonPlato">

🍽 Plato 6

</button>


<button class="botonPlato">

🥡 Para llevar

</button>


</div>


</section>

  <!-- =========================
     MENU DE PRODUCTOS
========================= -->


<section id="menuProductos" class="seccion">


<h2>
🌮 Tacos
</h2>


<div id="tacos"></div>



<h2>
🫓 Gringas
</h2>


<div id="gringas"></div>



<h2>
🥪 Lonches
</h2>


<div id="lonches"></div>



<h2>
🧀 Quesadillas
</h2>


<div id="quesadillas"></div>



<h2>
🌋 Volcanes
</h2>


<div id="volcanes"></div>



<h2>
🥤 Bebidas
</h2>


<div id="bebidas"></div>



</section>





<!-- =========================
        CARRITO
========================= -->


<section class="seccion carrito">


<h2>
🛒 Mi pedido
</h2>



<p id="platoActual">

Plato no seleccionado

</p>



<div id="listaCarrito">

Tu carrito está vacío

</div>



<h3>

Total:

$

<span id="total">

0

</span>


</h3>




<input 
type="text"
id="nombreCliente"
placeholder="Tu nombre"
>



<button id="enviarPedido">

Enviar pedido 🌮

</button>



</section>

</main>


<script type="module" src="menu.js"></script>


</body>

</html>
