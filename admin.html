<!DOCTYPE html>

<html lang="es">


<head>


    <meta charset="UTF-8">


    <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0">


    <title>
        Administrador - Tacos Milo 🌮
    </title>


    <link rel="stylesheet" href="style.css">


</head>



<body>


    <!-- ENCABEZADO ADMIN -->

    <header class="header">


        <h1>
            🌮 Panel Administrador
        </h1>


        <p>
            Tacos Milo
        </p>


    </header>



    <!-- LOGIN ADMIN -->

    <section class="admin">


        <h2>
            Acceso
        </h2>


        <input 
        type="password"
        id="claveAdmin"
        placeholder="Contraseña">


        <button onclick="entrarAdmin()">

            Entrar

        </button>


    </section>

  
    <!-- PANEL PRINCIPAL (OCULTO AL INICIO) -->

    <section 
    class="admin"
    id="panelAdmin"
    style="display:none;">



        <h2>
            Administración de Tacos Milo 🌮
        </h2>



        <!-- PROMOCIÓN -->

        <div class="dato">


            <h3>
                🎉 Promoción
            </h3>


            <input
            type="text"
            id="promoTexto"
            placeholder="Ejemplo: 2x1 tacos pastor">


            <button onclick="guardarPromo()">

                Guardar promoción

            </button>


        </div>




        <!-- AGUAS -->

        <div class="dato">


            <h3>
                🥤 Sabores de agua
            </h3>


            <input
            type="text"
            id="nuevoSabor"
            placeholder="Nuevo sabor">


            <button onclick="agregarSabor()">

                Agregar sabor

            </button>


            <div id="listaAguas">


            </div>


        </div>


        <!-- ADMINISTRAR PRODUCTOS -->

        <div class="dato">


            <h3>
                🌮 Productos
            </h3>



            <input
            type="text"
            id="nombreProducto"
            placeholder="Nombre del producto">



            <input
            type="number"
            id="precioProducto"
            placeholder="Precio">



            <button onclick="agregarProducto()">

                Agregar producto

            </button>



        </div>




        <!-- LISTA DE PRODUCTOS -->

        <div class="dato">


            <h3>
                📋 Productos actuales
            </h3>



            <div id="listaProductos">


            </div>



        </div>

      
        <!-- PEDIDOS RECIBIDOS -->

        <div class="dato">


            <h3>
                📦 Pedidos
            </h3>



            <div id="listaPedidos">


            </div>


        </div>




        <!-- CERRAR SESIÓN -->

        <button onclick="salirAdmin()">

            Cerrar sesión

        </button>



    </section>





    <!-- JAVASCRIPT ADMIN -->

    <script src="admin.js"></script>



</body>


</html>
